# Local stack: MongoDB + API gateway + core-service + order-service.
#
#   docker compose up --build        then open http://localhost:5000/health
#
# The storefront keeps using http://localhost:5000/api, exactly as before the split.
# Only the gateway publishes a port to your machine; the two services are reachable
# only on the compose network, the way they would be on a private network in production.
#
# Secrets below have development defaults. To use real values (for example the payment
# provider's), put them in a .env file next to this compose file or export them first.

name: looksmatter

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017" # published only so you can use mongosh, the seed and the migration locally
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  core-service:
    build: ./services/core-service
    restart: unless-stopped
    environment:
      PORT: 5001
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: looksmatter
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-only-internal-key-change-me}
      ORDER_SERVICE_URL: http://order-service:5002
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy

  order-service:
    build: ./services/order-service
    restart: unless-stopped
    environment:
      PORT: 5002
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: looksmatter_orders # its own database
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-only-internal-key-change-me}
      CORE_SERVICE_URL: http://core-service:5001
      SOURCE_MONGO_DB: looksmatter # only used by the one-time migration script
      PaymentGateway_CLIENT_ID: ${PaymentGateway_CLIENT_ID:-}
      PaymentGateway_SECRET_KEY: ${PaymentGateway_SECRET_KEY:-}
      PaymentGateway_ENCRYPTION_KEY: ${PaymentGateway_ENCRYPTION_KEY:-}
      PaymentGateway_API_URL: ${PaymentGateway_API_URL:-}
      PaymentGateway_STATUS_API_URL: ${PaymentGateway_STATUS_API_URL:-}
      PaymentGateway_CALLBACK_URL: ${PaymentGateway_CALLBACK_URL:-}
    depends_on:
      mongo:
        condition: service_healthy

  gateway:
    build: ./gateway
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      CORE_SERVICE_URL: http://core-service:5001
      ORDER_SERVICE_URL: http://order-service:5002
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      core-service:
        condition: service_healthy
      order-service:
        condition: service_healthy

volumes:
  mongo-data:
  uploads:
